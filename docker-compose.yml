# ==============================================================================
# MoSPI PAIMANA Early-Warning & Predictive Analytics Platform (SIH26103)
# Multi-Container Orchestration: Next.js Frontend + FastAPI Backend
# ==============================================================================


services:
  # ----------------------------------------------------------------------------
  # FastAPI Backend Service (ML Inference, Repository Data, Auth & RBAC)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: paimana-backend
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      - DATA_STATUS=REAL DATA SOURCED FROM PAIMANA PROJECT REPORTS
      - JWT_SECRET=${JWT_SECRET:-nirman-drishti-mospi-jwt-secret-key-2026-production}
      - ACCESS_TOKEN_EXPIRE_MINUTES=720
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - paimana-network

  # ----------------------------------------------------------------------------
  # Next.js 14 Frontend Service (SSR, Client Dashboard, India Interactive Map)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - BACKEND_URL=http://backend:8000
        - INTERNAL_API_URL=http://backend:8000/api/v1
    container_name: paimana-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - INTERNAL_API_URL=http://backend:8000/api/v1
      - BACKEND_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - paimana-network

networks:
  paimana-network:
    name: paimana-network
    driver: bridge
