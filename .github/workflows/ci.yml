# ==============================================================================
# MoSPI PAIMANA Early-Warning & Predictive Analytics Platform (SIH26103)
# Production CI/CD Pipeline - Automated Testing, Linting & Docker Verification
# ==============================================================================

name: CI/CD Pipeline

"on":
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Backend Automated Tests (FastAPI, ML Inference, Repositories, Auth/RBAC)
  # ----------------------------------------------------------------------------
  backend-tests:
    name: Backend Tests (Python 3.12 / Pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pytest
          python -m pip show matplotlib
          python -c "import matplotlib; print(matplotlib.__version__)"

      - name: Run Pytest test suite
        run: |
          python -m pytest tests/ -v

  # ----------------------------------------------------------------------------
  # Job 2: Frontend Validation (TypeScript, ESLint, Next.js Production Build)
  # ----------------------------------------------------------------------------
  frontend-validation:
    name: Frontend Validation (Next.js 14 / Node 20)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install dependencies (clean install)
        run: npm ci

      - name: TypeScript type checking
        run: npx tsc --noEmit

      - name: ESLint validation
        run: npm run lint

      - name: Next.js production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production

  # ----------------------------------------------------------------------------
  # Job 3: Docker Build, Compose Validation & Container Smoke Tests
  # ----------------------------------------------------------------------------
  docker-build-and-test:
    name: Docker Build & Container Smoke Test
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-validation]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose specification
        run: |
          echo "Validating docker-compose.yml configuration..."
          docker compose config

      - name: Build Docker images
        run: |
          echo "Building multi-container stack via Docker Compose..."
          docker compose build

      - name: Start container services
        run: |
          echo "Starting containers in detached mode..."
          docker compose up -d

      - name: Await backend health & readiness
        run: |
          echo "Polling backend health endpoint (http://localhost:8000/api/v1/health)..."
          TIMEOUT=60
          ELAPSED=0
          READY=false

          while [ $ELAPSED -lt $TIMEOUT ]; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/api/v1/health || true)
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Backend returned HTTP 200 after ${ELAPSED}s."
              READY=true
              break
            fi
            sleep 3
            ELAPSED=$((ELAPSED + 3))
            echo "Waiting for backend service... (${ELAPSED}s / ${TIMEOUT}s, current status: ${HTTP_CODE})"
          done

          if [ "$READY" != "true" ]; then
            echo "ERROR: Backend service failed to become healthy within ${TIMEOUT} seconds."
            exit 1
          fi

      - name: Verify backend health payload
        run: |
          HEALTH_JSON=$(curl -s -f http://localhost:8000/api/v1/health)
          echo "Health payload received: $HEALTH_JSON"
          echo "$HEALTH_JSON" | grep -q '"status":"healthy"' || {
            echo "ERROR: Backend status is not healthy"
            exit 1
          }

      - name: Verify frontend HTTP response
        run: |
          echo "Polling frontend response on port 3000 (http://localhost:3000)..."
          TIMEOUT=60
          ELAPSED=0
          READY=false

          while [ $ELAPSED -lt $TIMEOUT ]; do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000 || true)
            if [ "$HTTP_STATUS" = "200" ] || [ "$HTTP_STATUS" = "307" ] || [ "$HTTP_STATUS" = "308" ]; then
              echo "Frontend returned HTTP status $HTTP_STATUS after ${ELAPSED}s."
              READY=true
              break
            fi
            sleep 3
            ELAPSED=$((ELAPSED + 3))
            echo "Waiting for frontend service... (${ELAPSED}s / ${TIMEOUT}s, current status: ${HTTP_STATUS})"
          done

          if [ "$READY" != "true" ]; then
            echo "ERROR: Frontend failed to become ready within ${TIMEOUT} seconds."
            echo "=== Container Process Status ==="
            docker compose ps
            echo "=== Frontend Container Logs (Last 100 lines) ==="
            docker compose logs frontend --tail=100 || true
            echo "=== Frontend Health Inspection ==="
            docker inspect --format='{{json .State.Health}}' paimana-frontend || true
            exit 1
          fi

      - name: Inspect running containers
        run: |
          echo "=== Docker Compose Process Status ==="
          docker compose ps

      - name: Clean up containers & dump diagnostic logs on failure
        if: always()
        run: |
          echo "=== Backend Container Logs (Last 50 lines) ==="
          docker compose logs backend --tail=50 || true
          echo "=== Frontend Container Logs (Last 50 lines) ==="
          docker compose logs frontend --tail=50 || true
          echo "Tearing down container stack..."
          docker compose down -v
