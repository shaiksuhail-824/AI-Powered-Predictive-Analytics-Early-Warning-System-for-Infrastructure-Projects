stages:
  ingest:
    cmd: python src/data/ingest.py
    deps:
      - src/data/ingest.py
    outs:
      - data/raw/paimana_time_overrun.csv
      - reports/source_metadata.md

  validate:
    cmd: python src/data/validate.py
    deps:
      - data/raw/paimana_time_overrun.csv
      - src/data/validate.py
    outs:
      - data/interim/paimana_time_overrun_validated.csv
      - reports/data_quality.md

  eda:
    cmd: python src/data/eda.py
    deps:
      - data/interim/paimana_time_overrun_validated.csv
      - src/data/eda.py
    outs:
      - reports/figures
      - reports/eda_report.md

  preprocess:
    cmd: python src/data/preprocess.py
    deps:
      - data/interim/paimana_time_overrun_validated.csv
      - src/data/preprocess.py
    params:
      - preprocessing.missing_threshold
      - preprocessing.progress_min_clip
      - preprocessing.progress_max_clip
      - preprocessing.expenditure_ratio_max_clip
      - preprocessing.drop_duplicates
    outs:
      - data/processed/paimana_time_overrun_processed.csv

  feature_engineering:
    cmd: python src/data/feature_engineering.py
    deps:
      - data/processed/paimana_time_overrun_processed.csv
      - src/data/feature_engineering.py
    params:
      - feature_engineering.scale_features
      - feature_engineering.lag_lead_cutoff_only
      - targets.delay_threshold_months
    outs:
      - data/features/paimana_cuf_baseline.csv
      - data/features/paimana_ml_ready_time_overrun.csv
      - reports/feature_dictionary.md
      - reports/cuf_feature_mapping.md
      - reports/data_leakage_audit.md

  train:
    cmd: python -m src.ml.train
    deps:
      - data/features/paimana_ml_ready_time_overrun.csv
      - configs/model_params.yaml
      - src/ml/feature_pipeline.py
      - src/ml/train.py
    outs:
      - reports/training_run_summary.csv

  model_selection:
    cmd: python -m src.ml.model_selection
    deps:
      - reports/training_run_summary.csv
      - src/ml/model_selection.py
    outs:
      - models/schedule_delay/production_model.pkl
      - models/cost_overrun/production_model.pkl
      - models/selected_models_summary.json

  anomaly_sentinel:
    cmd: python -m src.ml.anomaly_detection
    deps:
      - data/features/paimana_ml_ready_time_overrun.csv
      - configs/model_params.yaml
      - src/ml/anomaly_detection.py
    outs:
      - models/anomaly_detector/production_anomaly_detector.pkl

  evaluate:
    cmd: python -m src.ml.evaluate
    deps:
      - reports/training_run_summary.csv
      - models/schedule_delay/production_model.pkl
      - models/cost_overrun/production_model.pkl
      - src/ml/evaluate.py
    outs:
      - reports/overfitting_underfitting_summary.csv
      - reports/cuf_vs_enhanced_comparison.csv

  register:
    cmd: python -m src.mlops.register_model
    deps:
      - models/schedule_delay/production_model.pkl
      - models/cost_overrun/production_model.pkl
      - models/anomaly_detector/production_anomaly_detector.pkl
      - src/mlops/register_model.py
    outs:
      - reports/mlops_registry_catalog.json
